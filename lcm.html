<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.7" />
    <title>LCM Engine</title>

    <style>
        html, body {
            background-color: #353535;
            font-family: monospace;
            color: #b9b9b9;
        }

        h1 {
            font-size: 5em;
        }

        button {
            font-family: monospace;
            transform: scale(1.8);
        }

        .cnt0 {
            margin: 0 8vw 0 8vw;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }

        .cnt00 {
            display: flex;
            align-items: center;
            justify-content: center;
            grid-column-gap: 10vw;
        }

        .cnt1 {
            display: flex;
            width: 15vw;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .cnt2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            grid-column-gap: 1vw;
        }

        .tx0 {
            font-family: monospace;
            width: 2.5vw;
            transform: scale(1.4);
        }

        .ck0 {
            transform: scale(1.4);
            border: none;
            background: none;
            font-family: monospace;
            color: #c0fcae
        }

        .box {
            width: 100%;
            height: 40vh;
            background-color: #9b9b9b;
        }
    </style>

    <!--<script type="text/javascript" src="src/lcm.js"></script>-->
    <script type="text/javascript" src="lcm.min.js"></script>

</head>

<body onload="init()">
    <br />
    <h1 id="mtime" align="center">0000</h1>
    <br />
    <div id="mcont" class="cnt0">
        <!--<div class="cnt1">
            <div id="dBx" class="box"></div>
            <br />
            <div class="cnt2">
                <input id="dTx" class="tx0" type="text" />
                <button id="dCk" class="ck0">&#10006;</button>
            </div>
        </div>-->
    </div>
    <br /><br /><br /><br /><br />
    <div class="cnt00">
        <button id="add">+ADD+</button>
        <button id="start">START</button>
    </div>
    <br />
</body>
</html>
